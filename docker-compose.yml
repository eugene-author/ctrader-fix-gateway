name: ctrader-fix-gateway

services:
  postgres:
    image: postgres:16
    restart: on-failure:5
    environment:
      POSTGRES_USER: ${DATABASE_USER:-gateway}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-gateway}
      POSTGRES_DB: ${DATABASE_NAME:-gateway}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-gateway}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: on-failure:5
    healthcheck:
      # `ping` only checks the Erlang node is alive, not that the AMQP
      # listener (5672) is actually bound and accepting connections yet -
      # depends_on: condition: service_healthy was reporting ready too
      # early, so fix-worker's first connect_robust() lost the race and
      # crashed (observed live: took 3 retries, ~90s, before it worked).
      # check_port_connectivity checks the listener itself.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
      target: runtime
    env_file: .env
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
      # Explicit: Dockerfile.api's last stage is `dev` (so docker-compose.override.yml's
      # local-dev convenience target has somewhere to inherit from), and Docker
      # defaults an unspecified target to the last stage - omitting this would
      # silently build dev (root, no hardening) as the production baseline.
      target: runtime
    env_file: .env
    restart: on-failure:5
    # Hardening: non-root (Dockerfile.api's USER appuser) + read-only root
    # filesystem. Only /tmp needs to be writable (Python's own tempfile use);
    # the app itself never writes to its own image at runtime.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  relay:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
      target: runtime
    env_file: .env
    command: ["python", "-m", "app.workers.relay"]
    restart: on-failure:5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Dockerfile.api's baked-in HEALTHCHECK probes :8000 (the api process's
    # own port) - meaningless here, this process serves nothing there.
    # relay's own /metrics (app.core.metrics_server, METRICS_PORT) is what
    # actually proves it's alive.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 5

  projector:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
      target: runtime
    env_file: .env
    command: ["python", "-m", "app.workers.projector"]
    restart: on-failure:5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 5

  fix-worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
      target: runtime
    # Needs real (or mock) cTrader FIX credentials - fill in ACCOUNT_ID and
    # FIX_TRADE_*/FIX_QUOTE_* in .env (gitignored; .env.example has the
    # full list of keys) before starting this service. See the README's
    # "Running the FIX worker" section for pointing it at a real demo
    # account vs. tests/mocks/fix_server.py.
    env_file: .env
    command: ["python", "-m", "app.workers.fix_worker"]
    restart: on-failure:5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    restart: on-failure:5
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    restart: on-failure:5
    # Anonymous admin - fine for this demo/local stack, never in a real
    # deployment (there's no auth in front of it).
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/observability/grafana-dashboard.json:/var/lib/grafana/dashboards/gateway.json:ro
      - ./deploy/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
