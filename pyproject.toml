[project]
name = "ctrader-fix-gateway"
version = "0.1.0"
description = "Asynchronous middleware bridging REST/WebSocket clients with cTrader via FIX 4.4"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "aio-pika>=9.5",
    "prometheus-client>=0.21",
    "alembic>=1.13",
    "ctrader-fix>=0.1.1",
    "pyopenssl>=24.0",
    "service-identity>=24.0",
    "sentry-sdk>=2.69.2",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "black>=24.10",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "hypothesis>=6.115",
    "import-linter>=2.1",
    "testcontainers[postgres,rabbitmq]>=4.8",
    "crochet>=2.1.1",
    "types-pyyaml>=6.0",
]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.uv]
override-dependencies = ["twisted>=26.4.0"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# CPY (copyright-header enforcement) is omitted
select = [
    "ASYNC", "B", "D", "E", "ERA", "F", "FIX", "I", "INP", "ISC", "Q", "RET",
    "RSE", "RUF", "S", "SIM", "T20", "TD", "T100", "UP", "W",
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ISC001", # conflicts with Black
]

[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic
"tests/**" = [
    "S101",   # assert is expected in tests
    "S105",   # fixed fixture credentials (e.g. FIX_TRADE_PASSWORD), not real secrets
    "S106",   # fixed testcontainers dev credentials, not real secrets
    "D",      # test functions are self-documenting by name; no docstrings required
    "INP001", # test packages don't need to be importable from outside pytest
]
"app/migrations/**" = ["D", "INP001"]  # alembic-generated files follow alembic's own template
"app/workers/fix_worker.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# ctrader_fix does no type stubs / py.typed marker
[[tool.mypy.overrides]]
module = "ctrader_fix"
ignore_missing_imports = true

# The core layers (domain/ports/services) has a stricter definitions than the rest of the app.
[[tool.mypy.overrides]]
module = ["app.domain.*", "app.ports.*", "app.services.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core is independent of infrastructure"
type = "layers"
layers = ["app.workers", "app.api", "app.services", "app.ports", "app.domain"]

[[tool.importlinter.contracts]]
name = "Domain, ports and services never import infrastructure"
type = "forbidden"
source_modules = ["app.domain", "app.ports", "app.services"]
forbidden_modules = [
    "app.db", "app.queue", "app.cache", "app.adapters",
    "sqlalchemy", "alembic", "aio_pika", "redis", "fastapi",
]

[[tool.importlinter.contracts]]
name = "Only the cTrader adapter may import ctrader_fix or twisted"
type = "forbidden"
source_modules = [
    "app.api", "app.core", "app.domain", "app.ports", "app.services",
    "app.db", "app.schemas",
]
forbidden_modules = ["ctrader_fix", "twisted"]
# fix_worker.py is the one place allowed to import the reactor and construct SessionManager.
